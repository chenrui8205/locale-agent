# V0 infra: Postgres (PostGIS + pgvector) and Redis.
# The app itself runs locally via `uv run` for fast iteration; compose only provides backing services.
services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: locale
      POSTGRES_PASSWORD: locale
      POSTGRES_DB: locale
    ports:
      - "5432:5432"
    volumes:
      - locale_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locale -d locale"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  locale_pgdata:
